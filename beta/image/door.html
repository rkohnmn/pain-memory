<!DOCTYPE html>
<html lang="en">
<head>

<title>door</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="js/ios-orientationchange-fix.min.js"></script>

<style>
/* Center page */
body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Fixed 1200x900 stage */
.stage {
    position: relative;
    width: 1200px;
    height: 900px;
    overflow: hidden;
}

/* Image container */
#image {
    position: absolute;
    width: 100%;
    height: 100%;
}

/* Scale image correctly */
#image img {
    width: 100%;
    height: 100%;
}

/* Remove outlines */
img[usemap],
map area {
    border: none;
    outline: none;
}
</style>

</head>

<body>

<div class="stage">

    <div id="image">
        <!-- Standardized to 3600x2700 -->
        <img src="media/door.jpg"
             width="3600"
             height="2700"
             usemap="#image-map"
             alt="door image" />

        <map name="image-map">
            <area target="" alt="" title="" href="../text/pain_expression.html" coords="2870,118,3013,111,3055,264,2988,337,2905,334,2857,232" shape="poly">
            <area target="" alt="" title="" href="../../alpha/text/tff.html" coords="596,385,1795,493,1910,2156,743,2112" shape="poly">
            <area target="" alt="" title="" href="../../alpha/image/2201.html" coords="3389,1371,3589,1377,3595,1622,3423,1609" shape="poly">
            <area shape="rect" title="background" href="../../alpha/text/snoww.html" coords="0,0,3600,2700">     
        </map>
    </div>

</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
<script src="jQuery-rwdImageMaps-master/jquery.rwdImageMaps.min.js"></script>

<script>
$(document).ready(function() {
    $('img[usemap]').rwdImageMaps();
});
</script>

</body>
</html>
