<!DOCTYPE html>
<html lang="en">
<head>

<title>2201</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="js/ios-orientationchange-fix.min.js"></script>

<style>
/* Center page */
body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Fixed 1200x900 stage */
.stage {
    position: relative;
    width: 1200px;
    height: 900px;
    overflow: hidden;
}

/* Image container */
#image {
    position: absolute;
    width: 100%;
    height: 100%;
}

/* Scale image correctly */
#image img {
    width: 100%;
    height: 100%;
}

/* Remove outlines */
img[usemap],
map area {
    border: none;
    outline: none;
}
</style>

</head>

<body>

<div class="stage">

    <div id="image">
        <!-- Standardized to 3600x2700 -->
        <img src="media/2201.jpg"
             width="3600"
             height="2700"
             usemap="#image-map"
             alt="2201 image" />

        <map name="image-map">
            <area target="" alt="" title="" href="../imagine/1103.html" coords="2155,1596,2797,1616,2489,1075,2813,522,2158,528,2412,1084" shape="poly">
            <area target="" alt="" title="" href="../../alpha/imagine/tf.html" coords="1274,1069,1496,843,1846,2004,1611,2188" shape="poly">
            <area target="" alt="" title="" href="../../alpha/imagine/hall.html" coords="987,1173,1646,499,1366,522" shape="poly">
            <area shape="rect" title="background" href="../../alpha/image/door.html" coords="0,0,3600,2700">   
        </map>
    </div>

</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
<script src="jQuery-rwdImageMaps-master/jquery.rwdImageMaps.min.js"></script>

<script>
$(document).ready(function() {
    $('img[usemap]').rwdImageMaps();
});
</script>

</body>
</html>
