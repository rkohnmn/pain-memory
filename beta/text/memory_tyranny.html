        .kernel:hover {
            transform: translate(-50%, -50%) scale(1.02);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9), 0 0 6px rgba(160,180,200,0.5);
        }
        
        /* Primary temporal kernels receive larger sizing */
        .kernel-primary {
            max-width: 350px;
        }
        
        /* Progress kernel gets final emphasis */
        .kernel-final {
            transition: all 0.35s ease;
        }
        
        .kernel-final:hover {
            letter-spacing: 0.02em;
        }
        
        /* Time thickened kernel receives central treatment */
        .kernel-central {

        }
