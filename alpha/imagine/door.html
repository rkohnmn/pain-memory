            position: relative;

        /* Background image with subtle enhancement */
        .bg-image {

        .overlay {
            position: absolute;
            top: 0;
            left: 0;

        /* Refined text container styling */

            transition: all 0.32s cubic-bezier(0.2, 0.88, 0.4, 1.05);
        }
        
        .text-container a {
            display: inline-block;
            color: #e6dac8;
            text-decoration: none;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: clamp(13px, 2.1vw, 19px);
            line-height: 1.48;
            padding: 10px 18px;
            background-color: rgba(26, 24, 30, 0.84);
            backdrop-filter: blur(3px);
            border-left: 2px solid rgba(150, 125, 100, 0.55);
            transition: all 0.28s ease;
            letter-spacing: 0.02em;
        }
        
        .text-container a:hover {
            background-color: rgba(54, 48, 58, 0.92);
            border-left-color: rgba(200, 170, 140, 0.85);
            color: #fff5ea;
            letter-spacing: 0.045em;
            transform: scale(1.01);
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .text-container a {
                padding: 6px 12px;
                font-size: clamp(11px, 1.9vw, 15px);
            }
            .text-container {
                max-width: 260px;
            }
        }
