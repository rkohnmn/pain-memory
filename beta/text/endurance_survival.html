        .kernel:hover {

            text-shadow: 2px 2px 10px rgba(0,0,0,0.9), 0 0 6px rgba(180,200,210,0.4);
        }
        
        /* Primary sensory kernels receive larger sizing */
        .kernel-primary {
            max-width: 320px;
        }
        
        /* Memory resurfacing kernel gets central emphasis */
        .kernel-central {
            max-width: 340px;
            transition: all 0.35s ease;
        }
        
        .kernel-central:hover {
            letter-spacing: 0.02em;
        }
