<!DOCTYPE html>
<html>
<head>
    <title>fragile construction · snowman</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }
        
        /* Background image with subtle enhancement */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../image/media/snowman.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.92) contrast(1.02);
        }
        
        /* Layered gradient overlay — fragile, temporary, fading */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 1;
        }
        
        /* Refined text container styling */
        .text-container {
            position: absolute;
            z-index: 10;
            transform: translate(-50%, -50%);
            max-width: 340px;
            text-align: center;
            transition: all 0.32s cubic-bezier(0.2, 0.88, 0.4, 1.05);
        }
        
        .text-container a {
            display: inline-block;
            color: #e8dfd0;
            text-decoration: none;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: clamp(13px, 2.1vw, 19px);
            line-height: 1.48;
            padding: 10px 18px;
            background-color: rgba(26, 24, 30, 0.82);
            backdrop-filter: blur(3px);
            border-left: 2px solid rgba(150, 125, 100, 0.55);
            transition: all 0.28s ease;
            letter-spacing: 0.02em;
        }
        
        .text-container a:hover {
            background-color: rgba(52, 48, 58, 0.9);
            border-left-color: rgba(195, 165, 135, 0.85);
            color: #fff7ec;
            letter-spacing: 0.045em;
            transform: scale(1.01);
        }
        
        /* Central torso text gets subtle prominence */
        .text-container.central a {
            background-color: rgba(34, 30, 40, 0.86);
            border-left-width: 3px;
            border-left-color: rgba(175, 145, 115, 0.7);
            font-size: clamp(14px, 2.3vw, 21px);
        }
        
        /* Head text — identity fused with loss */
        .text-container.head a {
            background-color: rgba(30, 28, 36, 0.84);
            letter-spacing: 0.03em;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .text-container a {
                padding: 6px 12px;
                font-size: clamp(11px, 1.9vw, 15px);
            }
            .text-container {
                max-width: 260px;
            }
            .text-container.central a {
                font-size: clamp(12px, 2.1vw, 17px);
            }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="overlay"></div>

    <!-- Head — identity fused with loss -->
    <div class="text-container head" style="top: 28%; left: 50%;">

    </div>

    <!-- Eyes — witnessing pain repeatedly enacted -->
    <div class="text-container" style="top: 35%; left: 60%;">
        <a href="../../beta/image/corn.html">witnessing pain repeatedly enacted</a>
    </div>

    <!-- Torso — attachment maintained through pain (central) -->
    <div class="text-container central" style="top: 55%; left: 50%;">
        <a href="../text/22201.html">attachment maintained through pain</a>
    </div>

    <!-- Base — loving despite inevitable loss -->
    <div class="text-container" style="top: 75%; left: 50%;">
        <a href="../image/ldr.html">loving despite inevitable loss</a>
    </div>

    <!-- Surrounding snow — anticipatory grief shaping behavior -->
    <div class="text-container" style="top: 20%; left: 30%;">
        <a href="#">anticipatory grief shaping behavior</a>
    </div>
</body>
</html>
