           PAGE-SPECIFIC REFINEMENTS
           Structural layout — evokes architecture, stability, then collapse
        ========================================= */
        
        /* Subtle gradient overlay for improved contrast */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

        /* Refined container styling — structural, architectural feel */
        .box0 div[id^="container"] {

            font-family: 'Georgia', 'Times New Roman', serif;

        /* Hover — structural elements becoming more present */
        .box0 div[id^="container"]:hover {
            background-color: rgba(48, 48, 55, 0.94);
            border-bottom-color: rgba(200, 175, 150, 0.8);
            transform: translate(-50%, -50%) scale(1.01);
            box-shadow: 0 6px 16px rgba(0,0,0,0.35);
        }
        
        /* Link styling — stable, grounded, then destabilizing on loss */
        .box0 div[id^="container"] a {

        .box0.structural #container1 a {

            font-size: 1.05em;
        }
        .box0.structural #container2 a {

        }
        .box0.structural #container3 a {

        }
        .box0.structural #container4 a { 
            font-weight: 500; 
        }
        .box0.structural #container5 a { 
            font-weight: 400;

            color: #c8bcac;
            letter-spacing: 0.01em;
        }
