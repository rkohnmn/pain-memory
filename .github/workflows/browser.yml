name: Browser regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run Chromium regressions
        run: python tests/browser_test.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ github.job }}
          path: test-results/
          retention-days: 7
