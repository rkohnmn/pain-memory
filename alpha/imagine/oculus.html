    <title>the witnessing eye · oculus</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }
        
        /* Background image with subtle enhancement */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../image/media/oculus.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.93) contrast(1.03);
        }
        
        /* Circular gradient overlay — mimics oculus light diffusion */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 35%, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0.75) 100%);
            pointer-events: none;
            z-index: 1;
        }
        
        /* Refined text container styling */
        .text-container {
            position: absolute;
            z-index: 10;
            transform: translate(-50%, -50%);
            max-width: 340px;
            text-align: center;
            transition: all 0.32s cubic-bezier(0.2, 0.88, 0.4, 1.05);
        }
        
        .text-container a {
            display: inline-block;
            color: #e8ddce;
            text-decoration: none;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: clamp(13px, 2.1vw, 19px);
            line-height: 1.48;
            padding: 10px 18px;
            background-color: rgba(22, 20, 28, 0.82);
            backdrop-filter: blur(3px);
            border-left: 2px solid rgba(155, 130, 110, 0.55);
            transition: all 0.28s ease;
            letter-spacing: 0.02em;
        }
        
        .text-container a:hover {
            background-color: rgba(52, 48, 60, 0.9);
            border-left-color: rgba(200, 175, 150, 0.85);
            color: #fff8ef;
            letter-spacing: 0.045em;
            transform: scale(1.01);
        }
        
        /* Central text gets subtle prominence */
        .text-container.central a {
            background-color: rgba(32, 28, 38, 0.88);
            border-left-width: 3px;
            border-left-color: rgba(185, 155, 130, 0.7);
            font-size: clamp(14px, 2.3vw, 21px);
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .text-container a {
                padding: 6px 12px;
                font-size: clamp(11px, 1.9vw, 15px);
            }
            .text-container {
                max-width: 260px;
            }
            .text-container.central a {
                font-size: clamp(12px, 2.1vw, 17px);
            }
        }
    </style>
</head>
