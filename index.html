<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="title" content="Pain and Memory" />
    <meta name="description" content="Memory-shaped affective accumulation: an exploration of how memory-bound psychological distress from lost friendship reshapes the capacity for empathy" />
    <meta name="author" content="Robbie Kohn" />
    <meta name="keywords" content="memory, pain, friendship, loss, empathy, trauma, repetition, absence, affective accumulation" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pain and Memory</title>
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@300;400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
 
    <style>
        :root {
            --ink: #e8e4dc;
            --ink-dim: #8a8680;
            --ink-ghost: #3a3835;
            --page: #0a0908;
            --seam: rgba(200, 190, 175, 0.12);
            --seam-bright: rgba(200, 190, 175, 0.28);
            --gold: #c8b89a;
            --gold-dim: rgba(200, 184, 154, 0.15);
        }
 
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }
 
        body {
            background: var(--page);
            color: var(--ink);
            font-family: 'EB Garamond', 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: visible;
            cursor: default;
            position: relative;
        }
 
        /* ── Grain overlay ── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.028;
            pointer-events: none;
            z-index: 100;
        }
 
        /* ── Ambient radial glow ── */
        .ambient {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
 
        .ambient-1 {
            width: 700px;
            height: 700px;
            top: -200px;
            left: -200px;
            background: radial-gradient(circle, rgba(60, 50, 35, 0.35) 0%, transparent 70%);
            animation: drift-1 18s ease-in-out infinite;
        }
 
        .ambient-2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -100px;
            background: radial-gradient(circle, rgba(40, 35, 25, 0.4) 0%, transparent 70%);
            animation: drift-2 22s ease-in-out infinite;
        }
 
        .ambient-3 {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(30, 27, 20, 0.6) 0%, transparent 70%);
        }
 
        @keyframes drift-1 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(40px, 25px); }
            66% { transform: translate(-20px, 40px); }
        }
 
        @keyframes drift-2 {
            0%, 100% { transform: translate(0, 0); }
            40% { transform: translate(-35px, -20px); }
            70% { transform: translate(20px, -40px); }
        }
 
        /* ── Particle canvas ── */
        #particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            animation: particleFadeIn 3s ease 1.5s forwards;
        }
 
        @keyframes particleFadeIn {
            to { opacity: 1; }
        }
 
        /* ── Main layout ── */
        main {
            position: relative;
            z-index: 10;
            width: min(780px, 92vw);
            display: grid;
            grid-template-rows: auto;
            align-items: center;
            justify-items: center;
            gap: 0;
            padding: 3.5rem 0 5rem;
            text-align: center;
        }
 
        /* ── Roman numeral / chapter marker ── */
        .chapter-mark {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 0.45em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 2.8rem;
            opacity: 0;
            animation: rise 1s ease 0.2s forwards;
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }
 
        .chapter-mark::before,
        .chapter-mark::after {
            content: '';
            display: block;
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
 
        /* ── Headline ── */
        .headline-wrap {
            margin-bottom: 0.4rem;
            overflow-x: visible;
        }
 
        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 300;
            font-size: clamp(3rem, 9.5vw, 6.2rem);
            letter-spacing: 0.18em;
            line-height: 1.05;
            color: var(--ink);
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(30px);
            animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
            position: relative;
        }
 
        h1 .word-pain {
            display: inline-block;
            position: relative;
        }
 
 
        h1:hover .word-pain::after {
            width: 100%;
        }
 
        .headline-and {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            font-size: clamp(2rem, 5.5vw, 3.8rem);
            letter-spacing: 0.08em;
            color: var(--ink-dim);
            margin: 0 0.4em;
            vertical-align: middle;
            position: relative;
            top: -0.08em;
        }
 
        /* ── Sub-rule ── */
        .rule-wrap {
            display: flex;
            align-items: center;
            gap: 0;
            width: 100%;
            margin: 2.2rem 0 2.6rem;
            opacity: 0;
            animation: rise 0.9s ease 0.9s forwards;
        }
 
        .rule {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--seam-bright) 50%, transparent 100%);
        }
 
        .rule-diamond {
            width: 5px;
            height: 5px;
            border: 1px solid var(--gold);
            transform: rotate(45deg);
            margin: 0 1.4rem;
            flex-shrink: 0;
        }
 
        /* ── Author ── */
        .author {
            font-family: 'EB Garamond', serif;
            font-size: 0.82rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--ink-dim);
            margin-bottom: 2.8rem;
            opacity: 0;
            animation: rise 0.9s ease 1s forwards;
        }
 
        /* ── Description ── */
        .description {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.08rem, 2.2vw, 1.28rem);
            line-height: 1.95;
            color: var(--ink-dim);
            max-width: 560px;
            margin-bottom: 3.8rem;
            opacity: 0;
            animation: rise 1s ease 1.15s forwards;
            position: relative;
            padding: 0 1rem;
        }
 
        .description::before,
        .description::after {
            content: '"';
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            line-height: 0;
            color: var(--ink-ghost);
            position: absolute;
        }
 
        .description::before {
            top: 1.4rem;
            left: -0.8rem;
        }
 
        .description::after {
            content: '"';
            bottom: 0.6rem;
            right: -0.8rem;
        }
 
        /* ── Enter button ── */
        .enter-wrap {
            margin-bottom: 4rem;
            opacity: 0;
            animation: rise 0.9s ease 1.4s forwards;
        }
 
        .enter-btn {
            display: inline-flex;
            align-items: center;
            gap: 1.1rem;
            text-decoration: none;
            color: var(--ink);
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            padding: 1rem 2.8rem;
            border: 1px solid var(--seam-bright);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            background: transparent;
            transition: color 0.5s ease, border-color 0.5s ease;
        }
 
        .enter-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gold-dim);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
 
        .enter-btn:hover::before {
            transform: scaleX(1);
        }
 
        .enter-btn:hover {
            border-color: var(--gold);
            color: var(--ink);
        }
 
        .enter-btn-text {
            position: relative;
            z-index: 1;
        }
 
        .enter-btn-arrow {
            position: relative;
            z-index: 1;
            display: inline-block;
            width: 18px;
            height: 1px;
            background: currentColor;
            transition: width 0.4s ease;
            vertical-align: middle;
        }
 
        .enter-btn-arrow::after {
            content: '';
            position: absolute;
            right: 0;
            top: -3px;
            width: 6px;
            height: 6px;
            border-right: 1px solid currentColor;
            border-top: 1px solid currentColor;
            transform: rotate(45deg);
        }
 
        .enter-btn:hover .enter-btn-arrow {
            width: 26px;
        }
 
        /* ── Footer ── */
        footer {
            opacity: 0;
            animation: rise 0.8s ease 1.7s forwards;
        }
 
        footer a {
            font-family: 'EB Garamond', serif;
            font-size: 0.78rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--ink-ghost);
            text-decoration: none;
            transition: color 0.4s ease;
            position: relative;
        }
 
        footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--ink-dim);
            transition: width 0.4s ease;
        }
 
        footer a:hover {
            color: var(--ink-dim);
        }
 
        footer a:hover::after {
            width: 100%;
        }
 
        /* ── Scroll hint ── */
        .scroll-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            animation: rise 0.8s ease 2.2s forwards;
            z-index: 10;
        }
 
        .scroll-hint-line {
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, var(--ink-dim), transparent);
            animation: scrollPulse 2.4s ease-in-out 2.2s infinite;
        }
 
        @keyframes scrollPulse {
            0%, 100% { opacity: 0.3; transform: scaleY(1); }
            50% { opacity: 0.7; transform: scaleY(0.6) translateY(10px); }
        }
 
        /* ── Shared rise animation ── */
        @keyframes rise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
 
        /* ── Mouse parallax target ── */
        .parallax-layer {
            transition: transform 0.15s linear;
        }
 
        /* ── Responsive ── */
        @media (max-width: 600px) {
            main {
                padding: 4rem 0 4rem;
            }
 
            .description::before,
            .description::after {
                display: none;
            }
 
            .description {
                padding: 0;
            }
 
            .chapter-mark::before,
            .chapter-mark::after {
                width: 20px;
            }
 
            .rule-diamond {
                margin: 0 0.8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-delay: 0ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                transition-delay: 0ms !important;
                scroll-behavior: auto !important;
            }
        }
        html[data-page-hidden] *, html[data-page-hidden] *::before,
        html[data-page-hidden] *::after { animation-play-state: paused !important; }
    </style>
</head>
<body>
 <style>
        @keyframes pulseWord {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.08);
                opacity: 0.75;
            }
        }

        .word-pain,
        .word-memory {
            display: inline-block;
        }

        .word-pain:hover,
        .word-memory:hover {
            animation: pulseWord 0.9s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-delay: 0ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                transition-delay: 0ms !important;
                scroll-behavior: auto !important;
            }
        }
        html[data-page-hidden] *, html[data-page-hidden] *::before,
        html[data-page-hidden] *::after { animation-play-state: paused !important; }
    </style>
    <!-- Ambient glows -->
    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>
    <div class="ambient ambient-3"></div>
 
    <!-- Particle canvas -->
    <canvas id="particles"></canvas>
 
    <main>
 
        <!-- Chapter mark -->
        <div class="chapter-mark parallax-layer" data-depth="0.4">
            
        </div>
 
        <!-- Headline -->
        <div class="headline-wrap parallax-layer" data-depth="0.2">
            <h1>
    <span class="word-pain">Pain</span><br>
    <span class="headline-and">&</span><br>
    <span class="word-memory">Memory</span>
            </h1>
        </div>
 
        <!-- Decorative rule -->
        <div class="rule-wrap">
            <div class="rule"></div>
            <div class="rule-diamond"></div>
            <div class="rule"></div>
        </div>
 
        <!-- Author -->
        <div class="author">Robbie Kohn</div>
 
        <!-- Description -->
        <p class="description parallax-layer" data-depth="0.1">
            Memory-shaped affective accumulation: an exploration of how memory-bound psychological distress from lost friendship reshapes the capacity for empathy.
        </p>
 
        <!-- Enter CTA -->
        <div class="enter-wrap">
            <a class="enter-btn" onclick="openPortalWindow(); return false;" href="#">
                <span class="enter-btn-text">Enter</span>
                <span class="enter-btn-arrow"></span>
            </a>
        </div>
 
        <!-- Footer -->
        <footer>
            <a href="credits.html">References &amp; Credits</a>
        </footer>
 
    </main>
 
    <!-- Subtle scroll cue -->
    <div class="scroll-hint" aria-hidden="true">
        <div class="scroll-hint-line"></div>
    </div>
 
    <script>
        /* Decorative motion shares one visibility-aware scheduler. */
        (function () {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            const layers = document.querySelectorAll('.parallax-layer');
            const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
            let frame = null, lastTime = null, width = 0, height = 0;
            let mx = 0, my = 0, cx = 0, cy = 0;
            const particles = [];
            function particle() {
                return {x: Math.random()*width, y: Math.random()*height,
                    r: Math.random()*1.2+0.2, alpha: Math.random()*0.35+0.05,
                    vx: (Math.random()-0.5)*0.08, vy: -Math.random()*0.12-0.03,
                    decay: Math.random()*0.0006+0.0003};
            }
            function schedule() {
                if (frame === null && !motion.matches && !document.hidden) frame = requestAnimationFrame(tick);
            }
            function tick(now) {
                frame = null;
                if (motion.matches || document.hidden) return;
                const delta = lastTime === null ? 1 : Math.min(3, (now-lastTime)/16.667);
                lastTime = now;
                ctx.clearRect(0, 0, width, height);
                particles.forEach((p, i) => {
                    p.x += p.vx*delta; p.y += p.vy*delta; p.alpha -= p.decay*delta;
                    if (p.alpha <= 0 || p.y < -10) {
                        particles[i] = particle(); particles[i].y = height+5; particles[i].alpha = 0.05;
                        return;
                    }
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(200, 184, 154, ${p.alpha})`; ctx.fill();
                });
                const smoothing = 1-Math.pow(0.94, delta);
                cx += (mx-cx)*smoothing; cy += (my-cy)*smoothing;
                layers.forEach(el => {
                    const depth = parseFloat(el.dataset.depth || 0.2);
                    el.style.transform = `translate(${cx*depth*10}px, ${cy*depth*6}px)`;
                });
                schedule();
            }
            function syncMotion() {
                if (frame !== null) cancelAnimationFrame(frame);
                frame = null; lastTime = null;
                document.documentElement.toggleAttribute('data-page-hidden', document.hidden);
                if (motion.matches) {
                    ctx.clearRect(0, 0, width, height);
                    mx = my = cx = cy = 0;
                    layers.forEach(el => { el.style.transform = 'none'; });
                }
                schedule();
            }
            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                schedule();
            }
            resize();
            for (let i=0; i<55; i++) particles.push(particle());
            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', e => {
                if (motion.matches || document.hidden) return;
                mx = (e.clientX/window.innerWidth-0.5)*2;
                my = (e.clientY/window.innerHeight-0.5)*2;
            });
            document.addEventListener('visibilitychange', syncMotion);
            motion.addEventListener('change', syncMotion);
            syncMotion();
        })();

        /* ── Portal window ── */
        function openPortalWindow() {
            const width = 1200;
            const height = 900;
            const left = (screen.width - width) / 2;
            const top = (screen.height - height) / 2;
            const features = [
                'toolbar=no', 'location=no', 'directories=no',
                'status=no', 'menubar=no', 'scrollbars=yes', 'resizable=yes',
                `width=${width}`, `height=${height}`, `left=${left}`, `top=${top}`
            ].join(',');
            const portalWindow = window.open('portal.html', 'PainAndMemoryPortal', features);
            if (!portalWindow) {
                window.location.href = 'portal.html';
            }
        }
    </script>
