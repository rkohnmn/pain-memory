<!DOCTYPE html>
<html lang="en">
<head>

<title>hall</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="js/ios-orientationchange-fix.min.js"></script>

<style>
/* Center page */
body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Fixed 1200x900 stage */
.stage {
    position: relative;
    width: 1200px;
    height: 900px;
    overflow: hidden;
}

/* Image container */
#image {
    position: absolute;
    width: 100%;
    height: 100%;
}

/* Scale image correctly */
#image img {
    width: 100%;
    height: 100%;
}

/* Remove outlines */
img[usemap],
map area {
    border: none;
    outline: none;
}
</style>

</head>

<body>

<div class="stage">

    <div id="image">
        <!-- Standardized to 3600x2700 for proper scaling -->
        <img src="media/hall.jpg"
             width="3600"
             height="2700"
             usemap="#image-map"
             alt="hall image" />

        <map name="image-map">
            <area target="" alt="" title="" href="../../alpha/image/2201.html" coords="3230,178,2536,153,2390,1333,3093,1371" shape="poly">
            <area target="" alt="" title="" href="../imagine/door.html" coords="727,6,981,6,708,2684,469,2681,711,229" shape="poly">
            <area target="" alt="" title="" href="../../alpha/text/snowwoman.html" coords="3306,181,3392,159,3287,922,3220,900,3226,795" shape="poly">
            <area target="" alt="" title="" href="../../alpha/image/corn.html" coords="1948,1237,2374,1266,2396,1355,3090,1393,3592,2150,3592,2678,1073,2690" shape="poly">    
        </map>
    </div>

</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
<script src="jQuery-rwdImageMaps-master/jquery.rwdImageMaps.min.js"></script>

<script>
$(document).ready(function() {
    $('img[usemap]').rwdImageMaps();
});
</script>

</body>
</html>
